# Faith Flash — Netlify config.
#
# The magazine PDF is hosted on ImageKit for CDN performance, but pdf.js on
# iOS Safari fails when it has to make cross-origin Range requests against
# ImageKit (ImageKit's 206 responses don't expose Content-Range / Accept-
# Ranges via Access-Control-Expose-Headers, and older Safari doesn't honour
# Access-Control-Allow-Headers: *). Proxied through this site's origin the
# Range requests are same-origin, so CORS never enters the picture.
#
# Order matters: the magazine proxy MUST come before the SPA catch-all, or
# /* would rewrite /magazines/files/*.pdf to index.html.

[[redirects]]
  from = "/magazines/files/*"
  to = "https://ik.imagekit.io/emmzy26/faithflash/magazines/:splat"
  status = 200
  force = true
  # Query strings (e.g. ?v=20261122 cache-bust) are forwarded to ImageKit by
  # default; ImageKit ignores unknown params on non-image files.

[[redirects]]
  from = "/podcasts"
  to = "/online-tv/audio"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Override ImageKit's year-long Cache-Control on the proxied PDF so a replaced
# file at the same path is picked up within an hour even without a ?v= bump.
[[headers]]
  for = "/magazines/files/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[build]
  command = "npm run build"
  publish = "dist"
